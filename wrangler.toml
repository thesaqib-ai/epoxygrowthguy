name = "epoxygrowthguy"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace used only by the form rate limit.
# Create it once with:
#   npx wrangler kv namespace create RATE_LIMIT
#   npx wrangler kv namespace create RATE_LIMIT --preview
# then paste the ids below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5c47723a5d154832a74974e8e7ac9857"
preview_id = "beabed8aaca24464b80a37fdc25b70d0"

# Email goes through Resend, not a Cloudflare binding. Cloudflare Email
# Sending is gated behind a paid Workers plan, and autosinq.com is already a
# verified sending domain on Resend for the Autosinq site, so there is no
# binding here and no DNS to change. The key is the RESEND_API_KEY secret.

[vars]
# "supabase" (default) or "airtable". See src/lib/store.ts.
STORE_TARGET = "supabase"

# Secrets are set in the Cloudflare dashboard, never here:
#   TURNSTILE_SECRET_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   RESEND_API_KEY            the same key the Autosinq site uses
#   NOTIFY_EMAIL              where the heads up lands
# PUBLIC_TURNSTILE_SITE_KEY is a build time variable, set it in the Pages
# build settings so Astro can read it.
