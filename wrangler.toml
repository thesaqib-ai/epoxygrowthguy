name = "epoxygrowthguy"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace used only by the form rate limit.
# Create it once with:
#   npx wrangler kv namespace create RATE_LIMIT
#   npx wrangler kv namespace create RATE_LIMIT --preview
# then paste the ids below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5c47723a5d154832a74974e8e7ac9857"
preview_id = "beabed8aaca24464b80a37fdc25b70d0"

# Transactional email, sent straight from the Pages Function.
# The sending domain is autosinq.com, not epoxygrowthguy.com, because that is
# where the from address lives. Onboard it first:
#   npx wrangler email sending enable autosinq.com
# Read docs/emails.md before running that, autosinq.com already sends mail and
# a second SPF record would break it.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["muhammad.saqib@autosinq.com"]

[vars]
# "supabase" (default) or "airtable". See src/lib/store.ts.
STORE_TARGET = "supabase"

# Secrets are set in the Cloudflare dashboard, never here:
#   TURNSTILE_SECRET_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   NOTIFY_EMAIL              where the heads up lands
# PUBLIC_TURNSTILE_SITE_KEY is a build time variable, set it in the Pages
# build settings so Astro can read it.
