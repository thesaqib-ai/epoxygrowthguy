name = "epoxygrowthguy"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace used only by the form rate limit.
# Create it once with:
#   npx wrangler kv namespace create RATE_LIMIT
#   npx wrangler kv namespace create RATE_LIMIT --preview
# then paste the ids below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "replace-with-your-kv-namespace-id"
preview_id = "replace-with-your-preview-kv-namespace-id"

# Transactional email, sent straight from the Pages Function.
# The domain has to be onboarded first:
#   npx wrangler email sending enable epoxygrowthguy.com
[[send_email]]
name = "EMAIL"

[vars]
# "supabase" (default) or "airtable". See src/lib/store.ts.
STORE_TARGET = "supabase"

# Secrets are set in the Cloudflare dashboard, never here:
#   TURNSTILE_SECRET_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   NOTIFY_EMAIL              where the heads up lands
# PUBLIC_TURNSTILE_SITE_KEY is a build time variable, set it in the Pages
# build settings so Astro can read it.
